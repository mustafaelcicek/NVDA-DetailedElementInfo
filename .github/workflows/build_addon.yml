name: build addon

on:
  push:
    tags: ["*"]
    # To build on main/master branch, uncomment the following line:
    # branches: [ main , master ]

  pull_request:
    branches: [ main, master ]

  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    - name: Install dependencies
      run: |
        sudo apt-get update  -y
        sudo apt-get install -y gettext
        uv sync

    - name: building addon
      run: uv run scons && uv run scons pot

    - name: Package Chrome Bridge
      run: python -m zipfile -c detailedElementInfo-chrome-bridge.zip Bridge

    - uses: actions/upload-artifact@v7
      with:
        name: packaged_addon
        path: |
          ./*.nvda-addon
        archive: false

    - uses: actions/upload-artifact@v7
      with:
        name: translation_template
        path: |
          ./*.pot
        archive: false

    - uses: actions/upload-artifact@v7
      with:
        name: chrome_bridge
        path: ./detailedElementInfo-chrome-bridge.zip
        archive: false

    # Lint / format / type-check via prek. Kept non-blocking for now: the existing
    # add-on source predates these tools, so failures here should not stop packaging.
    # Run after packaging because some hooks apply fixes; release artifacts must
    # contain the exact source from the tag rather than uncommitted hook changes.
    - name: Code checks
      continue-on-error: true
      run: export PREK_SKIP=no-commit-to-branch; uv run prek run --all-files

  upload_release:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: ["build"]
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - name: download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: .
        merge-multiple: true
    - name: Display structure of downloaded files
      run: ls -R
    - name: Calculate sha256
      run: |
        echo -e "\nSHA256: " >> changelog.md
        sha256sum *.nvda-addon *.zip >> changelog.md

    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          *.nvda-addon
          *.pot
          *.zip
        body_path: changelog.md
        fail_on_unmatched_files: true
        prerelease: ${{ contains(github.ref, '-') }}
